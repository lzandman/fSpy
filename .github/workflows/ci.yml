name: CI

# Per-PR quality gate: lint, typecheck and test on every push and pull
# request so regressions are caught before the OS-build workflows run.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Lint
        run: npx eslint .
